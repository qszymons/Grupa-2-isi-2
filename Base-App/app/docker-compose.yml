services:
  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=app
      - DB_USER=postgres
      - DB_PASSWORD=pass
    depends_on:
      - db
    networks:
      - backend
    container_name: backend

  worker:
    build:
      context: .
    volumes:
      - ./src:/src
    working_dir: /
    command: ["python", "-m", "src.worker"]
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=app
      - DB_USER=postgres
      - DB_PASSWORD=pass
    depends_on:
      - db
      - backend
    networks:
      - backend
    container_name: worker

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - backend
    container_name: frontend

  db:
    image: ankane/pgvector
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    container_name: db

networks:
  backend:

volumes:
  pgdata: